name: EncyKlopedia demo CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - run: ENCYKLOPEDIA_MODE=public node src/server.mjs && exit 1 || echo 'Public deployment remains blocked (expected)'
