name: Konstellation Release Qualification

on:
  push:
    tags:
      - 'v1.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: konstellation-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Require final version for release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const p=require('./package.json'); if (p.version.includes('-rc.')) { console.error('RC package cannot be published as a final release tag'); process.exit(1) }"

      - name: Require committed lockfile
        shell: bash
        run: test -f package-lock.json

      - name: Install reproducibly
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare reproducibility metadata
        run: npm run release:prepare

      - name: Require committed manifest and SBOM
        run: git diff --exit-code -- RELEASE-MANIFEST.json SBOM.cdx.json

      - name: Full qualification
        run: npm run release:check

      - name: Build release bundle
        run: |
          mkdir -p release-bundle
          cp -R dist server contracts docs examples scripts data lenses-enriched package.json package-lock.json README.md CHANGELOG.md RELEASE-MANIFEST.json SBOM.cdx.json release-bundle/
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf konstellation-${{ github.ref_name }}.tar.gz -C release-bundle .
          sha256sum konstellation-${{ github.ref_name }}.tar.gz > konstellation-${{ github.ref_name }}.tar.gz.sha256

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: konstellation-${{ github.ref_name }}
          path: |
            konstellation-${{ github.ref_name }}.tar.gz
            konstellation-${{ github.ref_name }}.tar.gz.sha256
          retention-days: 30
